<!-- pagina politicas -->
<script type="text/html" id="pagina-politicas">
  <section class="page-intro">
    <div class="wrap"><span class="eyebrow">TRANSPARÊNCIA</span>
      <h1>Políticas e termos.</h1>
      <p>Modelo de política para a apresentação acadêmica do BarberSync.</p>
    </div>
  </section>
  <section class="page-content">
    <div class="wrap policy-content">
      <div class="owner-note">Este texto é uma proposta demonstrativa para o TCC, não uma política jurídica definitiva. Antes de operar comercialmente, seria necessário revisar com profissionais responsáveis.</div>
      <div class="panel">
        <h2>1. Termos de uso</h2>
        <p>O BarberSync é apresentado como uma plataforma de descoberta de barbearias em Barueri, com perfis de estabelecimentos, agendamentos, avaliações e produtos. Nesta versão, todas as ações são simuladas e não constituem reserva ou compra real.</p>
        <h3>2. Privacidade e dados</h3>
        <p>Os cadastros, avaliações, horários, fotos e pedidos de demonstração são armazenados no navegador por meio de localStorage e sessionStorage. Não existe servidor, banco de dados nem transmissão automática desses dados ao BarberSync. Evite inserir nomes, telefones, e-mails ou senhas reais nesta versão.</p>
        <h3>3. Uso de fotos e avaliações</h3>
        <p>O proprietário de um estabelecimento deverá ter permissão para publicar imagens do espaço, dos profissionais e dos produtos. Comentários devem respeitar as pessoas e não conter conteúdo ofensivo. As avaliações atualmente exibidas são ilustrativas ou adicionadas localmente.</p>
        <h3>4. Agendamentos e cancelamentos</h3>
        <p>O cliente poderá solicitar e cancelar reservas de demonstração ainda confirmadas. Reservas marcadas como concluídas não poderão ser canceladas pelo cliente nesta simulação. As regras comerciais, reagendamentos e possíveis taxas de cancelamento de uma futura plataforma deverão ser definidas com clareza.</p>
        <h3>5. Produtos e pagamentos</h3>
        <p>Pedidos de pomadas, óleos e outros produtos não geram cobrança nesta versão. A opção de marcar um pedido como entregue serve apenas para ilustrar um controle interno.</p>
        <h3>6. Planos de assinatura</h3>
        <p>As mensalidades exibidas na página de planos são valores hipotéticos do projeto. Não há checkout, cobrança, renovação automática, faturamento de assinatura nem contrato comercial ativo. Regras de cancelamento, reajustes e serviços oferecidos ainda serão definidas em versões futuras.</p>
        <h3>7. Integrações futuras</h3>
        <p>Integração com Google Maps, dados reais de estabelecimentos, autenticação segura e pagamentos ficam fora do escopo deste módulo do TCC.</p>
        <h3>8. Dados e suporte</h3>
        <p>O usuário pode restaurar os dados da demonstração no painel. A limpeza dos dados do site no navegador também apaga os registros locais. Uma versão comercial deverá informar canais de suporte, direitos dos titulares de dados e regras de retenção e exclusão.</p>
        <p class="small">Documento ilustrativo • Versão acadêmica: novembro de 2026.</p>
      </div>
      <a class="btn btn-primary" href="#inicio">Voltar à vitrine</a>
    </div>
  </section>
</script>
